# ZohaOnline Discovery 2.7.0 — ZOHA-DISCOVERY-270
# Include inside every plausible active HTTP/HTTPS server for 5.61.27.185.

location = /zohaonline {
    return 301 /zohaonline/;
}

location ^~ /zohaonline/static/ {
    alias /opt/zohaonline/staticfiles/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Zoha-Release "ZOHA-DISCOVERY-270" always;
}

location ^~ /zohaonline/media/ {
    alias /opt/zohaonline/media/;
    expires 7d;
    add_header X-Zoha-Release "ZOHA-DISCOVERY-270" always;
}

location ^~ /zohaonline/ {
    client_max_body_size 30M;
    proxy_http_version 1.1;

    proxy_set_header Host 5.61.27.185;
    proxy_set_header X-Forwarded-Host 5.61.27.185;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    proxy_pass http://127.0.0.1:18123;
    proxy_redirect off;
    proxy_connect_timeout 15s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    add_header X-Zoha-Release "ZOHA-DISCOVERY-270" always;
    add_header X-Zoha-Backend "127.0.0.1:18123" always;
}
